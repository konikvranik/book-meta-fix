[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-meta-fix"
version = "0.1.0"
description = "Detect and fix metadata of ebooks in a Calibre-style library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Petr Vraník" }]
dependencies = [
	"click>=8.1",
	"lxml>=4.9",
	"requests>=2.28",
	"rich>=13.0",
	"PyYAML>=6.0",
	"rapidfuzz>=3.0",
	"Pillow>=10.0",
]

[project.optional-dependencies]
# PDF metadata (pdfinfo/pdftotext are primary; pypdf is optional)
pdf = ["pypdf>=4.0"]
# LLM reconciliation via Z.AI (OpenAI-compatible client)
# json-repair salvages invalid LLM JSON (unescaped quotes, control chars,
# truncation) that the built-in sanitizer cannot recover.
llm = ["openai>=1.10", "json-repair>=0.30"]
dev = [
	"pytest>=7.0",
	"pytest-cov>=4.0",
	"ruff>=0.1",
]

[project.scripts]
bmf = "book_meta_fix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length handled by formatter
# W191/E101: project uses tabs for indentation (see .editorconfig); these
# pycodestyle rules flag every tab-indented line, so they are baseline noise.
ignore = ["E501", "W191", "E101"]

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
